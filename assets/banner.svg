<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)" rx="12"/>

  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" rx="2"/>

  <!-- Globe icon -->
  <circle cx="100" cy="140" r="55" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="100" cy="140" rx="25" ry="55" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="45" y1="140" x2="155" y2="140" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="55" y1="110" x2="145" y2="110" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
  <line x1="55" y1="170" x2="145" y2="170" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>

  <!-- Title -->
  <text x="185" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#f1f5f9" letter-spacing="-2">PolaFusion</text>

  <!-- Accent underline -->
  <rect x="185" y="128" width="420" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Subtitle -->
  <text x="186" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" letter-spacing="0.5">Multilingual Political Polarization Detector</text>

  <!-- Tags -->
  <rect x="186" y="192" width="160" height="30" rx="15" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="266" y="212" font-family="system-ui, sans-serif" font-size="13" fill="#93c5fd" text-anchor="middle" font-weight="600">22 Languages</text>

  <rect x="356" y="192" width="130" height="30" rx="15" fill="#1a1a2e" stroke="#6366f1" stroke-width="1"/>
  <text x="421" y="212" font-family="system-ui, sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle" font-weight="600">3 Subtasks</text>

  <rect x="496" y="192" width="150" height="30" rx="15" fill="#1a1a1a" stroke="#ef4444" stroke-width="1"/>
  <text x="571" y="212" font-family="system-ui, sans-serif" font-size="13" fill="#fca5a5" text-anchor="middle" font-weight="600">SemEval 2026</text>

  <rect x="656" y="192" width="170" height="30" rx="15" fill="#0d2818" stroke="#22c55e" stroke-width="1"/>
  <text x="741" y="212" font-family="system-ui, sans-serif" font-size="13" fill="#86efac" text-anchor="middle" font-weight="600">8-Model Ensemble</text>

  <!-- Right side decorative bars -->
  <g opacity="0.3">
    <rect x="1050" y="60" width="8" height="160" rx="4" fill="#3b82f6"/>
    <rect x="1068" y="80" width="8" height="120" rx="4" fill="#6366f1"/>
    <rect x="1086" y="50" width="8" height="180" rx="4" fill="#8b5cf6"/>
    <rect x="1104" y="90" width="8" height="100" rx="4" fill="#ec4899"/>
    <rect x="1122" y="70" width="8" height="140" rx="4" fill="#ef4444"/>
    <rect x="1140" y="100" width="8" height="80" rx="4" fill="#f59e0b"/>
    <rect x="1158" y="60" width="8" height="160" rx="4" fill="#22c55e"/>
  </g>
</svg>
